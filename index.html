<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam Nichols</title>
<meta name="description" content="Liam Nichols: grants, partnerships and public service.">
<meta name="theme-color" content="#071f2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
/* ---------- Theme: edit these colours to restyle the whole site ---------- */
:root{
  --navy:#071f2e; --ink:#0b2a3c; --teal:#12616f; --aqua:#6ee7d8;   /* aqua = buttons and highlights */
  --head:#0b2a3c; --accent:#12616f; --paper:#f4f8f8; --surface:#fff; --text:#14303c; --muted:#547380; --line:#d3e2e5;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --sans:"Instrument Sans",system-ui,sans-serif; --serif:"Newsreader",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--head:#fff;--accent:#7cc9d1;--paper:#08171f;--surface:#0e2230;--text:#dbe9ec;--muted:#8fb0b9;--line:#1d3a47}
}
*,::before,::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
body{margin:0;background:var(--paper);color:var(--text);font:400 1.05rem/1.65 var(--sans)}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}
h1,h2,.brand,.btn,.stat b,.pillars h3{font-family:var(--display);font-stretch:75%;font-weight:850;text-transform:uppercase}
p{margin:0 0 1rem;max-width:65ch}
.wrap{width:min(1180px,100% - clamp(2.5rem,8vw,6rem));margin-inline:auto}
.sec{padding:clamp(3.5rem,8vw,6.5rem) 0}
.sec-pillars,.sec-articles{background:var(--surface)}
h2{font-size:clamp(2.4rem,5.5vw,4.25rem);line-height:.95;color:var(--head);margin:0 0 2.25rem}
h2::before{content:"";display:block;width:3.5rem;height:6px;background:var(--accent);margin-bottom:1.1rem}
h3{font:700 1.1rem/1.35 var(--sans);margin:0}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:1.5rem;padding:.75rem clamp(1.25rem,4vw,3rem);background:rgba(7,31,46,.93);backdrop-filter:blur(10px);color:#fff}
.brand{font-size:1.4rem;line-height:1;color:#fff;text-decoration:none;letter-spacing:.01em;margin-right:auto}
#nav{display:flex;gap:1.75rem}
#nav a{color:#bcd7dc;text-decoration:none;font-weight:500;font-size:.95rem;padding:.3rem 0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
#nav a:hover{color:#fff}
#nav a.on{color:#fff;border-color:var(--aqua)}
.top-r{display:flex;align-items:center;gap:.75rem}
.menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:.45rem .8rem;font:600 .9rem var(--sans)}
.btn{display:inline-block;background:var(--aqua);color:var(--navy);font-size:1rem;font-stretch:90%;letter-spacing:.04em;line-height:1;padding:.95rem 1.5rem;border-radius:4px;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.top .btn{padding:.7rem 1.1rem;font-size:.9rem}
.btn.ghost{background:none;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}

/* ---------- Hero ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;min-height:min(88svh,58rem);padding:5rem 0;background:var(--navy);color:#fff}
.hero .wrap{position:relative;z-index:2}
.tag{display:inline-block;margin-bottom:1.5rem;padding:.3rem .9rem;border:1px solid rgba(110,231,216,.55);border-radius:99px;color:var(--aqua);font-weight:600;font-size:.92rem}
.hero h1{font-size:clamp(3.2rem,8vw,7rem);line-height:.9;max-width:12ch;margin:0 0 1.5rem;color:#fff}
.sub{max-width:32rem;font-size:clamp(1.1rem,1.7vw,1.35rem);line-height:1.5;color:#cfe6e9;margin-bottom:2.25rem}
.hero-btns{display:flex;flex-wrap:wrap;gap:.8rem}
.hero-photo{position:absolute;top:0;right:0;bottom:0;width:56%;z-index:1;-webkit-mask-image:linear-gradient(to right,transparent,#000 42%);mask-image:linear-gradient(to right,transparent,#000 42%)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
#contours{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#contours path{fill:none;stroke:#5fb7c2;stroke-opacity:.22;stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.8s cubic-bezier(.3,.6,.2,1) forwards;animation-delay:calc(var(--i)*.12s)}
#contours g{animation:sway 22s ease-in-out infinite alternate}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sway{to{transform:translateY(-18px)}}

/* ---------- Images (a missing file shows a labelled placeholder) ---------- */
.pic{position:relative;margin:0;overflow:hidden;border-radius:6px;aspect-ratio:4/5;background:linear-gradient(135deg,var(--teal),var(--navy))}
.pic.wide{aspect-ratio:16/9;border-radius:0}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic figcaption{display:none}
.pic.ph{display:grid;place-items:center}
.pic.ph figcaption{display:block;padding:1rem;color:rgba(255,255,255,.7);font-size:.85rem;text-align:center}
.split{display:grid;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.split:has(>figure){grid-template-columns:minmax(0,4fr) minmax(0,5fr)}
.lead{font:italic 400 clamp(1.35rem,2.4vw,1.85rem)/1.4 var(--serif);color:var(--text)}

/* ---------- Module: stats ---------- */
.sec-stats{background:var(--teal);color:#fff;padding:0}
.stats{display:grid;grid-template-columns:repeat(var(--n,3),1fr)}
.stat{padding:2.5rem 1.5rem;border-left:1px solid rgba(255,255,255,.25)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-size:clamp(3rem,7vw,6rem);line-height:.9;color:var(--aqua);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:.7rem;color:#e1f2f4;font-weight:500;line-height:1.4;max-width:22ch}

/* ---------- Module: pillars ---------- */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2.5rem}
.pillars article{border-top:6px solid var(--accent);padding-top:1.25rem}
.pillars h3{font-size:2rem;line-height:1;color:var(--head);margin-bottom:.8rem}
.pillars p{margin:0}

/* ---------- Module: quote ---------- */
.sec-quote{position:relative;isolation:isolate;background:var(--ink) center/cover no-repeat;color:#fff;padding:clamp(5rem,12vw,9rem) 0}
.sec-quote::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,31,46,.93),rgba(7,31,46,.55))}
blockquote{margin:0;max-width:20em;font:italic 400 clamp(1.9rem,4.4vw,3.5rem)/1.2 var(--serif)}
cite{display:block;margin-top:1.5rem;font:600 1rem var(--sans);font-style:normal;color:var(--aqua)}

/* ---------- Module: timeline ---------- */
.tl{position:relative}
.tl::before,.tl .prog{content:"";position:absolute;left:5px;top:.6rem;bottom:.6rem;width:2px;background:var(--line)}
.tl .prog{bottom:auto;height:0;background:var(--accent)}
.tl ol{list-style:none;margin:0;padding:0 0 0 1.75rem}
.tl ol>li{position:relative;padding-bottom:2rem}
.tl ol>li:last-child{padding-bottom:0}
.tl ol>li::before{content:"";position:absolute;left:-1.75rem;top:.45rem;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line);transition:background .3s,border-color .3s}
.tl ol>li.on::before{background:var(--accent);border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.25rem 1rem;flex-wrap:wrap}
.when{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.org{color:var(--accent);font-weight:500;margin:.1rem 0 .6rem}
ul.b{margin:0;padding-left:1.1rem;max-width:65ch}
ul.b li{margin-bottom:.3rem}
ul.b li::marker{color:var(--accent)}
.roles{list-style:none;margin:.5rem 0 .75rem;padding:0 0 0 1rem;border-left:2px solid var(--line)}
.roles>li{padding:.3rem 0}
.roles h4{font:600 .95rem/1.35 var(--sans);margin:0}
.roles ul.b{margin-top:.3rem}

/* ---------- Module: cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-3px)}
.cb{padding:1.25rem 1.35rem}
.cb p{margin:0 0 .6rem}

/* ---------- Module: list and articles ---------- */
.refs,.arts{list-style:none;margin:0;padding:0}
.refs li{display:grid;grid-template-columns:4.5rem 1fr;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.refs li:first-child,.arts li:first-child{padding-top:0}
.arts li{padding:1.1rem 0;border-bottom:1px solid var(--line)}
.art-title{font:500 1.25rem/1.35 var(--serif);text-decoration:none}
a.art-title:hover{text-decoration:underline}
.arts p{margin:.15rem 0 0}
.art-meta{color:var(--muted);font-size:.9rem}
.art-desc{font-size:.95rem}

/* ---------- Module: tags ---------- */
.tg{margin-bottom:1.25rem}
.tg h3{margin-bottom:.5rem}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;list-style:none;margin:0;padding:0}
.tags li{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.2rem .85rem;font-size:.9rem}

/* ---------- Module: cta (closing band) ---------- */
.sec-cta{background:var(--navy);color:#fff}
.sec-cta h2{color:#fff;font-size:clamp(2.8rem,8vw,6.5rem);max-width:11ch}
.sec-cta h2::before{background:var(--aqua)}
.sec-cta p{font:italic 400 clamp(1.3rem,2.4vw,1.8rem)/1.4 var(--serif);color:#d6ebee;max-width:32ch;margin-bottom:2rem}
.btns{display:flex;flex-wrap:wrap;gap:.8rem}

footer{background:var(--navy);color:#8fb0b9;font-size:.9rem;padding:1.5rem 0;border-top:1px solid rgba(255,255,255,.1)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem}
footer a{color:#bcd7dc;margin-left:1.25rem}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .menu-btn{display:block}
  #nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;padding:.5rem clamp(1.25rem,4vw,3rem) 1rem;background:var(--navy)}
  .top.open #nav{display:flex}
  #nav a{padding:.8rem 0;border:0}
  .hero{flex-direction:column;align-items:stretch;padding:0 0 3.5rem;min-height:0}
  .hero .wrap{padding-top:2.5rem}
  .hero-photo{position:relative;width:100%;height:min(75vw,420px);order:-1;margin-bottom:-2.5rem;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}
  .hero h1{font-size:clamp(3rem,15vw,5rem)}
  .split:has(>figure){grid-template-columns:1fr}
  .pic{aspect-ratio:4/3}
  .stats{grid-template-columns:1fr}
  .stat,.stat:first-child{display:flex;align-items:baseline;gap:1rem;padding:1.1rem 0;border-left:0}
  .stat+.stat{border-top:1px solid rgba(255,255,255,.25)}
  .stat b{min-width:6.5rem;font-size:3rem}
  .stat span{margin:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,::before,::after{animation:none!important;transition:none!important}
  #contours path{stroke-dashoffset:0}
}
@media print{
  .top,#contours,.hero-photo,.btn{display:none}
  .hero,.sec-stats,.sec-quote,.sec-cta{background:none!important;color:#000!important;min-height:0;padding:1rem 0}
  .hero h1,.sub,.stat b,.stat span,blockquote,.sec-cta h2,.sec-cta p{color:#000!important}
}
</style>
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="#hero" id="brand"></a>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="top-r"><a class="btn" id="cta-top"></a><button class="menu-btn" id="menu" aria-expanded="false">Menu</button></div>
</header>

<section class="hero" id="hero">
  <svg id="contours" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g></g></svg>
  <div class="hero-photo" id="hero-photo"></div>
  <div class="wrap">
    <span class="tag" id="tag"></span>
    <h1 id="slogan"></h1>
    <p class="sub" id="sub"></p>
    <div class="hero-btns"><a class="btn" id="cta-hero"></a><a class="btn ghost" id="cta-2"></a></div>
  </div>
</section>

<main id="content"><noscript><p class="wrap">This page needs JavaScript to display.</p></noscript></main>

<footer><div class="wrap"><span>&copy; <span id="yr"></span> <span id="foot"></span></span><span id="flinks"></span></div></footer>

<script>
/* =====================================================================
   1. YOUR BRAND. Edit this block: name, slogan, hero photo, buttons.
      Images go in the same folder as index.html. Hero photo: a well-lit portrait
      with you on the right half works best (about 1600px wide or larger).
   ===================================================================== */
const SITE = {
  name: "Liam Nichols",
  tag: "Chair, Whitby Public Library Board",
  slogan: "Partnerships that deliver for communities.",
  sub: "Grants and Partnerships Coordinator, Town of Ajax. I help public institutions turn good ideas into funded, lasting results.",
  hero: "hero.jpg",                                         // set to "" for no photo
  cta:  { label: "Get in touch",   href: "mailto:you@example.com" },   // top bar, hero and closing band
  cta2: { label: "See the record", href: "#experience" },
  links: [{ label: "LinkedIn", href: "https://www.linkedin.com/in/liamnicholswhitby" }]
};

/* =====================================================================
   2. YOUR SECTIONS, in order. Copy an entry to add a component.
      Types: stats | text | pillars | quote | timeline | cards | list | articles | tags | cta
      nav: "Label" sets the top-bar link; nav: false hides it. No title = no heading.
      image: "file.jpg" works on text, cards and quote (a missing file shows a placeholder).
      Any text can include simple HTML such as <a href="...">link</a> or <em>italics</em>.
   ===================================================================== */
const SECTIONS = [
  { id: "impact", type: "stats", items: [
      { value: 90, prefix: "$", suffix: "M", label: "in grant funding secured" },
      { value: 25, suffix: "+", label: "active community and institutional partnerships" },
      { value: 10, suffix: "+", label: "years in public service" }
  ]},
  { id: "about", title: "Meet Liam", nav: "About", type: "text", image: "about.jpg", body: [
      "Public servant working where municipal government, community institutions and funders meet. Replace this with two or three sentences in your own voice.",
      "A second paragraph is optional. Use it for what drives you, your research, or what you want to do next."
  ]},
  { id: "priorities", title: "What I stand for", nav: "Priorities", type: "pillars", items: [
      { title: "Funding that delivers", text: "Secure the dollars, then make sure they reach residents. One or two sentences." },
      { title: "Partnerships that last", text: "Agreements built on trust, shared goals and clear results." },
      { title: "Libraries for everyone", text: "Public institutions that stay open, welcoming and relevant." }
  ]},
  { id: "quote", type: "quote", image: "quote.jpg",
    text: "Public institutions work best when everyone has a seat at the table.", cite: "Liam Nichols" },
  { id: "experience", title: "The record", nav: "Record", type: "timeline", items: [
      { title: "Grants and Partnerships Coordinator", org: "Town of Ajax", place: "Ajax, Ontario", when: "20XX – Present",
        bullets: [
          "Secure and manage external funding for municipal initiatives.",
          "Develop and sustain agreements with community and institutional partners.",
          "Add a result with a number: what you led, the scale, the outcome."
        ]},
      { title: "Previous role", org: "Organization", place: "City", when: "20XX – 20XX",
        bullets: ["One line on scope.", "One line on impact."] }
  ]},
  { id: "service", title: "Governance and service", nav: "Service", type: "cards", items: [
      { title: "Whitby Public Library Board", meta: "20XX – Present (8 years)", image: "board.jpg",
        text: "Governance, strategic planning and community engagement for the library.",
        roles: [
          { title: "Chair", when: "20XX – Present", bullets: ["Lead the board and its work with the library CEO and Town Council."] },
          { title: "Board member", when: "20XX – 20XX" }
        ] },
      { title: "Another board or committee", meta: "Role, years", text: "One sentence on your contribution.", href: "https://example.com", linkLabel: "Visit site" }
  ]},
  { id: "articles", title: "In the news", nav: "Press", type: "articles", items: [
      { title: "Title of the article, op-ed or story", href: "https://example.com/article", author: "Author Name", source: "Publication", date: "2025", description: "One or two sentences on what it covers." },
      { title: "Another article", href: "https://example.com/another", source: "Publication", date: "2024" }
  ]},
  { id: "education", title: "Education", nav: false, type: "timeline", items: [
      { title: "Degree name", org: "University", place: "City", when: "20XX", bullets: ["Thesis, honours or focus area."] },
      { title: "Degree name", org: "University", place: "City", when: "20XX" }
  ]},
  { id: "scholarship", title: "Publications and talks", nav: false, type: "list", items: [
      { when: "2025", text: "Author. <em>Title of article or conference paper.</em> Journal or venue." },
      { when: "2024", text: "Invited talk: <em>Title</em>. Event, city." }
  ]},
  { id: "skills", title: "Skills", nav: false, type: "tags", groups: [
      { label: "Public affairs", tags: ["Policy analysis", "Stakeholder engagement", "Governance"] },
      { label: "Funding and partnerships", tags: ["Grant writing", "Agreements", "Public-private partnerships"] }
  ]},
  { id: "contact", title: "Let's work together", nav: false, type: "cta",
    text: "Open to conversations about grants, partnerships, public-sector governance and library leadership.",
    buttons: [
      { label: "Email me", href: "mailto:you@example.com", primary: true },
      { label: "Connect on LinkedIn", href: "https://www.linkedin.com/in/liamnicholswhitby" }
    ]}
];

/* =====================================================================
   3. MODULES: one function per component type, returning HTML.
      Add your own by adding a key here, styling it above, and using it as "type".
   ===================================================================== */
const $ = q => document.querySelector(q);
const ext = h => /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : "";
const fmt = (n, dec) => n.toLocaleString("en-CA", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const pic = (src, cls = "") => `<figure class="pic ${cls}"><img src="${src}" alt="" loading="lazy" onerror="this.parentNode.classList.add('ph');this.remove()"><figcaption>${src}</figcaption></figure>`;
const rolesHtml = r => `<ul class="roles">${r.map(x => `<li><div class="row"><h4>${x.title}</h4><span class="when">${x.when || ""}</span></div>${x.bullets ? `<ul class="b">${x.bullets.map(b => `<li>${b}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>`;

const MODULES = {
  text: s => `<div class="split">${s.image ? pic(s.image) : ""}<div>${s.body.map((p, i) => `<p${i ? "" : ' class="lead"'}>${p}</p>`).join("")}</div></div>`,

  pillars: s => `<div class="pillars">${s.items.map(i => `<article><h3>${i.title}</h3><p>${i.text}</p></article>`).join("")}</div>`,

  quote: s => `<blockquote>${s.text}</blockquote>${s.cite ? `<cite>${s.cite}</cite>` : ""}`,

  timeline: s => `<div class="tl"><span class="prog"></span><ol>${s.items.map(i => `
    <li><div class="row"><h3>${i.title}</h3><span class="when">${i.when || ""}</span></div>
    <p class="org">${[i.org, i.place].filter(Boolean).join(", ")}</p>
    ${i.bullets ? `<ul class="b">${i.bullets.map(b => `<li>${b}</li>`).join("")}</ul>` : ""}${i.roles ? rolesHtml(i.roles) : ""}</li>`).join("")}</ol></div>`,

  cards: s => `<div class="cards">${s.items.map(i => `
    <article class="card">${i.image ? pic(i.image, "wide") : ""}<div class="cb"><h3>${i.title}</h3>${i.meta ? `<p class="org">${i.meta}</p>` : ""}
    ${i.text ? `<p>${i.text}</p>` : ""}${i.roles ? rolesHtml(i.roles) : ""}${i.href ? `<a href="${i.href}" target="_blank" rel="noopener">${i.linkLabel || "Learn more"}</a>` : ""}</div></article>`).join("")}</div>`,

  list: s => `<ul class="refs">${s.items.map(i => `<li><span class="when">${i.when || ""}</span><span>${i.text}</span></li>`).join("")}</ul>`,

  articles: s => `<ul class="arts">${s.items.map(i => `<li>${i.href ? `<a class="art-title" href="${i.href}" target="_blank" rel="noopener">${i.title}</a>` : `<span class="art-title">${i.title}</span>`}
    <p class="art-meta">${[i.author, i.source, i.date].filter(Boolean).join(", ")}</p>${i.description ? `<p class="art-desc">${i.description}</p>` : ""}</li>`).join("")}</ul>`,

  tags: s => s.groups.map(g => `<div class="tg"><h3>${g.label}</h3><ul class="tags">${g.tags.map(t => `<li>${t}</li>`).join("")}</ul></div>`).join(""),

  stats: s => `<div class="stats" style="--n:${s.items.length}">${s.items.map(i => {
    const dec = i.decimals || 0, pre = i.prefix || "", suf = i.suffix || "";
    return `<div class="stat"><b data-to="${i.value}" data-dec="${dec}" data-pre="${pre}" data-suf="${suf}">${pre}${fmt(i.value, dec)}${suf}</b><span>${i.label}</span></div>`;
  }).join("")}</div>`,

  cta: s => `<p>${s.text}</p><div class="btns">${s.buttons.map(b => `<a class="btn${b.primary ? "" : " ghost"}" href="${b.href}"${ext(b.href)}>${b.label}</a>`).join("")}</div>`
};

/* =====================================================================
   4. BUILD THE PAGE (you shouldn't need to edit below this line)
   ===================================================================== */
const btn = (el, c) => { $(el).textContent = c.label; $(el).href = c.href; };
$("#brand").textContent = SITE.name;
$("#tag").textContent = SITE.tag;
$("#slogan").textContent = SITE.slogan;
$("#sub").textContent = SITE.sub;
btn("#cta-top", SITE.cta); btn("#cta-hero", SITE.cta); btn("#cta-2", SITE.cta2);
if (SITE.hero) $("#hero-photo").innerHTML = `<img src="${SITE.hero}" alt="${SITE.name}" onerror="this.parentNode.remove()">`;
else $("#hero-photo").remove();
$("#foot").textContent = SITE.name;
$("#yr").textContent = new Date().getFullYear();
$("#flinks").innerHTML = SITE.links.map(l => `<a href="${l.href}"${ext(l.href)}>${l.label}</a>`).join("");

const label = s => s.nav === undefined ? s.title : s.nav;
$("#nav").innerHTML = SECTIONS.filter(label).map(s => `<a href="#${s.id}">${label(s)}</a>`).join("");
$("#content").innerHTML = SECTIONS.map(s => {
  const m = MODULES[s.type];
  if (!m) { console.warn("Unknown module type:", s.type); return ""; }
  const bg = s.type === "quote" && s.image ? ` style="background-image:url('${s.image}')"` : "";
  return `<section id="${s.id}" class="sec sec-${s.type}"${bg}><div class="wrap">${s.title ? `<h2>${s.title}</h2>` : ""}${m(s)}</div></section>`;
}).join("");

/* Hero contour lines */
let d = "";
for (let i = 0; i < 16; i++) {
  let p = "";
  for (let x = -20; x <= 1460; x += 20) {
    const y = 40 + i * 50 + 30 * Math.sin(x / 140 + i * .45) + 16 * Math.sin(x / 52 - i * .3);
    p += (x < 0 ? "M" : "L") + x + " " + y.toFixed(1);
  }
  d += `<path d="${p}" pathLength="1" style="--i:${i}"/>`;
}
$("#contours g").innerHTML = d;

/* Mobile menu */
$("#menu").onclick = () => $("#menu").setAttribute("aria-expanded", $("#top").classList.toggle("open"));
$("#nav").onclick = e => { if (e.target.tagName === "A") { $("#top").classList.remove("open"); $("#menu").setAttribute("aria-expanded", "false"); } };

/* Highlight the current section in the nav */
const links = [...document.querySelectorAll("#nav a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.hash === "#" + e.target.id));
}), { rootMargin: "-35% 0px -60% 0px" });
document.querySelectorAll("section").forEach(s => io.observe(s));

/* Timeline fills as you scroll */
const tls = [...document.querySelectorAll(".tl")];
const update = () => {
  const y = innerHeight * .6;
  tls.forEach(t => {
    const r = t.getBoundingClientRect();
    t.querySelector(".prog").style.height = Math.min(1, Math.max(0, (y - r.top) / r.height)) * 100 + "%";
    t.querySelectorAll("ol>li").forEach(li => li.classList.toggle("on", li.getBoundingClientRect().top < y));
  });
};
let raf;
addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(update); }, { passive: true });
addEventListener("resize", update);
update();

/* Stats count up once when scrolled into view (skipped if reduced motion is on) */
if (!matchMedia("(prefers-reduced-motion:reduce)").matches) {
  const countIO = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    countIO.unobserve(e.target);
    const el = e.target, to = +el.dataset.to, dec = +el.dataset.dec, t0 = performance.now(), dur = 1400;
    const tick = now => {
      const p = Math.min(1, (now - t0) / dur), v = to * (1 - Math.pow(1 - p, 3));
      el.textContent = el.dataset.pre + fmt(v, dec) + el.dataset.suf;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }), { threshold: .6 });
  document.querySelectorAll(".stat b").forEach(b => {
    b.textContent = b.dataset.pre + fmt(0, +b.dataset.dec) + b.dataset.suf;
    countIO.observe(b);
  });
}
</script>
</body>
</html>
